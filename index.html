<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Starfield</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --cyan: #00f0ff;
      --purple: #a855f7;
      --emerald: #00ff9d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      overflow: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Interactive Canvas Background */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Ambient Nebulas */
    .nebula-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.22;
      animation: pulseGlow 14s ease-in-out infinite alternate;
    }

    .nebula-1 {
      top: 5%;
      left: 10%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, #00f0ff 0%, #3b82f6 50%, transparent 70%);
    }

    .nebula-2 {
      bottom: 20%;
      right: 5%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, #a855f7 0%, #6366f1 50%, transparent 70%);
      animation-delay: -7s;
    }

    .nebula-3 {
      top: 50%;
      left: 45%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #00ff9d 0%, #0284c7 60%, transparent 75%);
      opacity: 0.12;
      animation-delay: -3s;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9) translate(0, 0); opacity: 0.15; }
      50% { transform: scale(1.1) translate(20px, -20px); opacity: 0.28; }
      100% { transform: scale(0.95) translate(-15px, 15px); opacity: 0.18; }
    }
  </style>
</head>
<body>

  <!-- Background Canvas -->
  <canvas id="starfield"></canvas>

  <!-- Glowing Nebulas -->
  <div class="nebula-glow nebula-1"></div>
  <div class="nebula-glow nebula-2"></div>
  <div class="nebula-glow nebula-3"></div>

  <script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    const STAR_COUNT = 260;
    const MAX_DISTANCE = 110;
    const SPEED = 0.08;
    const MAX_DISTANCE_SQ = MAX_DISTANCE * MAX_DISTANCE;
    const LINK_MAX_ALPHA = 0.22;
    const LINK_WIDTH = 0.5;
    const MOUSE_LINK_WIDTH = 1.4;

    let width, height;
    let stars = [];
    const mouse = { x: -1000, y: -1000 };

    function resize() {
      const prevWidth = width;
      const prevHeight = height;
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      if (prevWidth && prevHeight && stars.length) {
        const scaleX = width / prevWidth;
        const scaleY = height / prevHeight;
        stars.forEach(star => {
          star.x *= scaleX;
          star.y *= scaleY;
        });
      }
    }

    class Star {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 1.6 + 0.8;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * SPEED;
        this.vy = Math.sin(angle) * SPEED;
        this.baseColor = { r: 210, g: 230, b: 255 };
        this.glowColor = { r: 0, g: 240, b: 255 };
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height;
        if (this.y > height) this.y = 0;
      }
      draw(distToMouse) {
        let r = this.baseColor.r;
        let g = this.baseColor.g;
        let b = this.baseColor.b;
        let alpha = 0.65;

        if (distToMouse < MAX_DISTANCE) {
          const ratio = 1 - (distToMouse / MAX_DISTANCE);
          r = Math.round(this.baseColor.r + (this.glowColor.r - this.baseColor.r) * ratio);
          g = Math.round(this.baseColor.g + (this.glowColor.g - this.baseColor.g) * ratio);
          b = Math.round(this.baseColor.b + (this.glowColor.b - this.baseColor.b) * ratio);
          alpha = 0.65 + (0.35 * ratio);
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        ctx.fill();
      }
    }

    function initStars() {
      resize();
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push(new Star());
      }
    }

    function animateStars() {
      ctx.clearRect(0, 0, width, height);
      stars.forEach(star => star.update());

      // Star-to-star links
      ctx.lineWidth = LINK_WIDTH;
      for (let i = 0; i < stars.length; i++) {
        const a = stars[i];
        for (let j = i + 1; j < stars.length; j++) {
          const b = stars[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const distSq = dx * dx + dy * dy;
          if (distSq >= MAX_DISTANCE_SQ) continue;

          const opacity = (1 - Math.sqrt(distSq) / MAX_DISTANCE) * LINK_MAX_ALPHA;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(180, 210, 255, ${opacity})`;
          ctx.stroke();
        }
      }

      // Cursor links & stars
      ctx.lineWidth = MOUSE_LINK_WIDTH;
      stars.forEach(star => {
        const dx = mouse.x - star.x;
        const dy = mouse.y - star.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < MAX_DISTANCE) {
          const opacity = (1 - (dist / MAX_DISTANCE)) * 0.6;
          ctx.beginPath();
          ctx.moveTo(star.x, star.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = `rgba(0, 240, 255, ${opacity})`;
          ctx.stroke();
        }

        star.draw(dist);
      });

      requestAnimationFrame(animateStars);
    }

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouse.x = -1000;
      mouse.y = -1000;
    });
    window.addEventListener('resize', resize);

    initStars();
    animateStars();
  </script>
</body>
</html>
